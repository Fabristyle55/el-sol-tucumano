[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

[dev]
  command = "npm run dev:front"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# La raíz muestra la presentación del proyecto.
[[redirects]]
  from = "/"
  to = "/presentacion/index.html"
  status = 302

# El resto de las rutas las maneja React (aplicación de una sola página).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
